<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FurniAI Studio v0.1</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0f1115;color:#eee}header{padding:14px 18px;border-bottom:1px solid #2b2f38;display:flex;justify-content:space-between;align-items:center}main{display:grid;grid-template-columns:310px 1fr 330px;min-height:calc(100vh - 59px)}aside{padding:16px;border-right:1px solid #2b2f38;background:#151820}.right{border-left:1px solid #2b2f38;border-right:0}.stage{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,#303746,#11131a 70%)}canvas{width:100%;height:100%;display:block}.field{margin:10px 0}.field label{display:flex;justify-content:space-between;font-size:12px;color:#aeb5c2}.field input{width:100%;margin-top:5px}.btn{width:100%;padding:10px;border:1px solid #3b4250;background:#202631;color:#fff;border-radius:9px;margin-top:8px;cursor:pointer}.btn:hover{background:#2a3240}.chat{display:flex;gap:7px;margin-top:10px}.chat input{min-width:0;flex:1;padding:10px;background:#10131a;border:1px solid #343a46;color:white;border-radius:8px}.chat button{padding:10px 12px;border:0;border-radius:8px;background:#eee;color:#111}.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #292e37;font-size:13px}.ok{color:#72d29a}.muted{color:#9da5b3;font-size:12px}.title{font-weight:700}.badge{font-size:11px;padding:4px 7px;border:1px solid #3d4553;border-radius:99px}.parts{max-height:48vh;overflow:auto}.part{padding:8px 0;border-bottom:1px solid #292e37}.help{margin-top:12px;padding:10px;background:#191e27;border-radius:9px;font-size:12px;color:#b8bfca}@media(max-width:900px){main{grid-template-columns:1fr}.left,.right{border:0;border-bottom:1px solid #2b2f38}.stage{height:55vh}.right{display:block}}
</style></head><body><header><div><b>FurniAI Studio</b> <span class="badge">Prototype v0.1</span></div><span class="muted">Параметрическое проектирование мебели</span></header><main><aside class="left"><div class="title">Комната</div><div class="field"><label>Ширина <span id="rwv">4000 мм</span></label><input id="rw" type="range" min="2000" max="7000" step="50" value="4000"></div><div class="field"><label>Длина <span id="rlv">5000 мм</span></label><input id="rl" type="range" min="2000" max="9000" step="50" value="5000"></div><div class="field"><label>Высота <span id="rhv">2700 мм</span></label><input id="rh" type="range" min="2200" max="4000" step="50" value="2700"></div><hr style="border-color:#292e37"><div class="title">Шкаф</div><div class="field"><label>Ширина <span id="wv">1800 мм</span></label><input id="w" type="range" min="600" max="3600" step="50" value="1800"></div><div class="field"><label>Высота <span id="hv">2400 мм</span></label><input id="h" type="range" min="600" max="2700" step="50" value="2400"></div><div class="field"><label>Глубина <span id="dv">600 мм</span></label><input id="d" type="range" min="300" max="1000" step="10" value="600"></div><div class="field"><label>Полки <span id="sv">4</span></label><input id="s" type="range" min="0" max="10" step="1" value="4"></div><div class="field"><label>Ящики <span id="drvv">0</span></label><input id="dr" type="range" min="0" max="8" step="1" value="0"></div><button class="btn" id="doors">Двери: 2</button><div class="chat"><input id="cmd" placeholder="Например: добавь 3 ящика"><button id="go">AI</button></div><div class="help">Попробуйте: «сделай шкаф ниже на 100 мм», «добавь 3 ящика», «сделай глубину 500 мм».</div></aside><section class="stage"><canvas id="c"></canvas></section><aside class="right"><div class="title">Проект</div><div class="stat"><span>Статус</span><span class="ok">● Проверено</span></div><div class="stat"><span>Размер</span><span id="size">1800 × 2400 × 600</span></div><div class="stat"><span>Деталей</span><span id="pc">0</span></div><div class="stat"><span>Ящиков</span><span id="dc">0</span></div><h3>Список деталей</h3><div class="parts" id="parts"></div></aside></main><script>
const $=id=>document.getElementById(id), ids=['rw','rl','rh','w','h','d','s','dr']; const val={}; let doors=2;
function sync(){ids.forEach(id=>{val[id]=+$ (id).value; const out=$(id+'v'); if(out) out.textContent=val[id]+' мм';}); $('sv').textContent=val.s; $('drvv').textContent=val.dr; $('size').textContent=`${val.w} × ${val.h} × ${val.d}`; $('dc').textContent=val.dr; build(); draw();}
ids.forEach(id=>$(id).addEventListener('input',sync)); $('doors').onclick=()=>{doors=doors?0:2;$('doors').textContent='Двери: '+doors;build();draw()}; $('go').onclick=run; $('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
function run(){let x=$('cmd').value.toLowerCase(); if(!x)return; let m=x.match(/(\d+)\s*мм/); if(x.includes('ниже')&&m){$('h').value=Math.max(600,val.h-+m[1]);} else if(x.includes('высот')&&m){$('h').value=+m[1]} else if(x.includes('глуб')&&m){$('d').value=+m[1]} else if(x.includes('шир')&&m){$('w').value=+m[1]} else if(x.includes('ящ')&&m){$('dr').value=Math.min(8,+m[1])} else if(x.includes('ящ')){$('dr').value=1} sync();$('cmd').value='';}
function build(){let a=[['Левая боковина',val.d,val.h],['Правая боковина',val.d,val.h],['Верх',val.w,val.d],['Низ',val.w,val.d],['Задняя стенка',val.w,val.h],...Array.from({length:val.s},(_,i)=>['Полка '+(i+1),val.w-36,val.d-18]),...Array.from({length:doors},(_,i)=>['Фасад '+(i+1),val.w/doors-4,val.h-4]),...Array.from({length:val.dr},(_,i)=>['Ящик '+(i+1),val.w-80,Math.max(120,(val.h-120)/(val.dr+2))])]; $('pc').textContent=a.length;$('parts').innerHTML=a.map(p=>`<div class="part"><b>${p[0]}</b><br><span class="muted">${Math.round(p[1])} × ${Math.round(p[2])} мм</span></div>`).join('')}
const c=$('c'),ctx=c.getContext('2d'); function draw(){let w=c.clientWidth,h=c.clientHeight,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let s=Math.min((w*.52)/val.w,(h*.58)/val.h),cw=val.w*s,ch=val.h*s,cd=val.d*s,x=(w-cw)/2-20,y=(h-ch)/2+25;ctx.strokeStyle='#8993a3';ctx.lineWidth=2;ctx.fillStyle='#242b36';ctx.fillRect(x,y,cw,ch);ctx.strokeRect(x,y,cw,ch);ctx.fillStyle='#303946';ctx.fillRect(x+cw,y,cw*.16, ch);ctx.strokeRect(x+cw,y,cw*.16,ch);ctx.fillStyle='#1b2028';for(let i=1;i<=val.s;i++){let yy=y+ch*i/(val.s+1);ctx.fillRect(x+5,yy-3,cw-10,6)} if(val.dr){let dh=Math.max(20,ch/(val.dr+3));for(let i=0;i<val.dr;i++){let yy=y+ch-25-(i+1)*dh;ctx.strokeRect(x+cw*.08,yy,cw*.84,dh-5)}} if(doors){ctx.strokeStyle='#aeb7c5';ctx.strokeRect(x+2,y+2,cw/2-3,ch-4);ctx.strokeRect(x+cw/2+1,y+2,cw/2-3,ch-4)}ctx.fillStyle='#b9c1cc';ctx.font='12px system-ui';ctx.fillText(`${val.w} mm`,x+cw/2-30,y+ch+30);ctx.save();ctx.translate(x-20,y+ch/2);ctx.rotate(-Math.PI/2);ctx.fillText(`${val.h} mm`,0,0);ctx.restore();ctx.fillText(`Глубина ${val.d} мм`,x+cw+20,y+20)} window.onresize=draw; sync();
</script></body></html>
